seed: 42
run_fold: 1

data:
  dataset_path: "/kaggle/input/datasets/almanoff/pastis-dataset"
  noloss_classes: [19]
  to_rgb: true

ablation:
  dataset_fraction: 1.0
  cloud_drop_rate: 0.0

model:
  backbone: vjepa2_1_vit_giant_384

training:
  num_classes: 20
  epochs: 100
  batch_size: 16
  img_size: 128
  hidden_dim: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lr_patience: 15
  stp_patience: 27
  checkpoint_dir: "/kaggle"
  class_weighting: true