seed: 42
run_fold: 1

data:
  dataset_path: "/kaggle/input/pastis-dataset"
  noloss_classes: [19]
  to_rgb: True

dataset_fraction: 1.0
cloud_drop_rate: 0.0

model:
  backbone: vjepa2_vit_base
  adaptation: linear_probe  # linear_probe | lora | finetune

training:
  learning_rate: 1e-4
  weight_decay: 1e-2

data:
  max_seq_len: 10