defaults:
  dataset_fraction: 1.0
  cloud_drop_rate: 0.0

  model:
    backbone: vjepa2_vit_base
    adaptation: linear_probe   # linear_probe | lora | finetune

  training:
    learning_rate: 1e-4

groups:

  dataset_scaling:
    dataset_fraction: [0.01, 0.03, 0.1, 0.3, 1.0]

  cloud_ablation:
    cloud_drop_rate: [0.0, 0.2, 0.5]

  adaptation_comparison:
    model.adaptation:
      - linear_probe
      - lora

  adaptation_&_scaling:
    dataset_fraction:
      - 0.01
      - 0.03
      - 0.1
      - 0.3
      - 1.0
    model.adaptation:
      - linear_probe
      - lora